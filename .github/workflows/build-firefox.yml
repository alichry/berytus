name: Build Firefox with Berytus

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  MOZ_DIR: ${{ github.workspace }}/../mozilla-unified
  MOZBUILD_STATE_PATH: ${{ github.workspace }}/../.mozbuild

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Berytus source
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mercurial python3 python3-pip rsync patch

      - name: Read changeset
        id: changeset
        run: |
          REV=$(grep '^changeset:' mozilla-unified/import-changeset.txt | sed 's/changeset:[[:space:]]*//' | cut -d: -f2)
          echo "rev=$REV" >> "$GITHUB_OUTPUT"
          echo "Using mozilla-unified changeset: $REV"

      - name: Cache mozilla-unified source
        id: cache-moz
        uses: actions/cache@v4
        with:
          path: ${{ env.MOZ_DIR }}
          key: mozilla-unified-${{ steps.changeset.outputs.rev }}

      - name: Cache mozbuild state (toolchains)
        uses: actions/cache@v4
        with:
          path: ${{ env.MOZBUILD_STATE_PATH }}
          key: mozbuild-${{ runner.os }}-${{ steps.changeset.outputs.rev }}
          restore-keys: |
            mozbuild-${{ runner.os }}-

      - name: Clone mozilla-unified
        if: steps.cache-moz.outputs.cache-hit != 'true'
        run: |
          hg clone --stream https://hg.mozilla.org/mozilla-unified "$MOZ_DIR"
          cd "$MOZ_DIR"
          hg update -r ${{ steps.changeset.outputs.rev }}

      - name: Reset mozilla-unified to clean state
        working-directory: ${{ env.MOZ_DIR }}
        run: |
          hg update -C -r ${{ steps.changeset.outputs.rev }}
          hg purge --all

      - name: Export Berytus to mozilla-unified
        run: |
          ./port export "$MOZ_DIR"

      - name: Bootstrap build environment
        working-directory: ${{ env.MOZ_DIR }}
        run: |
          ./mach --no-interactive bootstrap --application-choice=browser

      - name: Create mozconfig
        run: |
          cat > "$MOZ_DIR/mozconfig" << 'EOF'
          ac_add_options --enable-application=browser
          ac_add_options --enable-optimize
          ac_add_options --disable-debug
          mk_add_options MOZ_OBJDIR=@TOPSRCDIR@/obj-x86_64-pc-linux-gnu
          EOF

      - name: Build Firefox
        working-directory: ${{ env.MOZ_DIR }}
        run: |
          ./mach build

      - name: Package Firefox
        working-directory: ${{ env.MOZ_DIR }}
        run: |
          ./mach package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firefox-berytus-linux-x86_64
          path: ${{ env.MOZ_DIR }}/obj-x86_64-pc-linux-gnu/dist/*.tar.bz2
          if-no-files-found: error
