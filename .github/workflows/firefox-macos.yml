name: Firefox with Berytus (MacOS)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: ${{ github.workflow }}

env:
  MOZ_DIR: /Users/runner/work/berytus/mozilla-unified
  MOZ_DIR_CLOBBER: /home/runner/work/berytus/mozilla-unified/CLOBBER
  MOZ_OBJ_DIR: /Users/runner/work/berytus/mozilla-unified/obj-x86_64-apple-darwin24.6.0
  MOZBUILD_STATE_PATH: /Users/runner/work/berytus/mozbuild
  SCCACHE_DIR: /Users/runner/work/berytus/sccache
  SCCACHE_CACHE_SIZE: 5G
  BERYTUS_TOOLKIT_DIR: /Users/runner/work/berytus/mozilla-unified/toolkit/components/berytus
  BERYTUS_TOOLKIT_MODULES_DIR: /Users/runner/work/berytus/mozilla-unified/toolkit/components/berytus/modules
  SECRETSTAR_DIR: /Users/runner/work/berytus/mozilla-unified/browser/extensions/secretstar
  SECRETSTAR_MOZBUILD: /Users/runner/work/berytus/mozilla-unified/browser/extensions/secretstar/moz.build
  SECRETSTAR_BUILD_DIR1: /Users/runner/work/berytus/mozilla-unified/browser/extensions/secretstar/build
  SECRETSTAR_BUILD_DIR2: /Users/runner/work/berytus/mozilla-unified/browser/extensions/secretstar/build.worker
  SECRETSTAR_BUILD_DIR3: /Users/runner/work/berytus/mozilla-unified/browser/extensions/secretstar/public

jobs:
  build:
    runs-on: macos-15-intel # Kernel Version: Darwin 24.6.0
    timeout-minutes: 360
    outputs:
      changeset-rev: ${{ steps.changeset.outputs.rev }}

    steps:
      - name: Checkout Berytus source
        uses: actions/checkout@v4

      - name: Setup Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install system dependencies
        run: |
          brew install mercurial autoconf nasm yasm node

      - name: Install Rust and cargo-binstall
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash

      - name: Install cbindgen and sccache
        run: cargo binstall cbindgen sccache

      - name: Install Rust target x86_64-apple-darwin
        run: rustup target add x86_64-apple-darwin

      - name: Select Xcode 16.0
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0'

      - name: Verify Xcode selection
        run: |
          # Print some diagnostics
          uname -m
          ls /Applications/ | grep -i xcode
          for x in /Applications/Xcode*.app; do
            echo "=== $x ==="
            ls "$x/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/" 2>/dev/null
          done
          xcodebuild -version
          xcrun --show-sdk-version
          xcrun --show-sdk-path

      - name: Read changeset
        id: changeset
        run: |
          REV=$(grep '^changeset:' mozilla-unified/import-changeset.txt | sed 's/changeset:[[:space:]]*//' | cut -d: -f2)
          echo "rev=$REV" >> "$GITHUB_OUTPUT"
          echo "Using mozilla-unified changeset: $REV"

      - name: Cache node modules
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-

      - name: Cache mozbuild state
        uses: actions/cache@v4
        env:
          cache-name: cache-mozbuild-state
        with:
          path: ${{ env.MOZBUILD_STATE_PATH }}
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ steps.changeset.outputs.rev }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-${{ steps.changeset.outputs.rev }}-

      - name: Cache sccache
        uses: actions/cache@v4
        env:
          cache-name: cache-sccache
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ steps.changeset.outputs.rev }}-${{ hashFiles('mozilla-unified/**/*') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-${{ steps.changeset.outputs.rev }}-

      - name: Clone mozilla-unified
        run: |
          hg clone --stream https://hg.mozilla.org/mozilla-unified "$MOZ_DIR"

      - name: Run mach bootstrap
        run: |
          cd "$MOZ_DIR"
          # TODO(berytus): Once we assume a more recent revision,
          # run bootstrap under that revision, and cache mozilla-unified
          ./mach --no-interactive bootstrap --application-choice=browser || true

      - name: Checkout revision
        run: |
          cd "$MOZ_DIR"
          hg update -r ${{ steps.changeset.outputs.rev }}

      # TODO(berytus): Keep this patch until we assume a recent revision
      # $ curl -sL "https://hg.mozilla.org/mozilla-unified/raw-file/tip/config/external/nspr/pr/moz.build" -o /tmp/moz.build.tip; diff ./config/external/nspr/pr/moz.build /tmp/moz.build.tip
      # 1,2d0
      # < # -*- Mode: python; indent-tabs-mode: nil; tab-width: 40 -*-
      # < # vim: set filetype=python:
      # 58a57,60
      # >     # os_Darwin.s is a CPP-driven arch dispatcher (#ifdef __x86_64__ /
      # >     # __i386__ / __ppc__ → #include "os_Darwin_<arch>.s"); without
      # >     # preprocessing the resulting object would be empty.
      # >     ASFLAGS += ["-x", "assembler-with-cpp"]
      # 72c74,76
      # <         ASFLAGS += ["-x", "assembler-with-cpp", "-D_ASM"]
      # ---
      # >         # os_SunOS_sparcv9.s uses #include <sys/asm_linkage.h> and CPP
      # >         # macros (ENTRY/SET_SIZE); without preprocessing it won't build.
      # >         ASFLAGS += ["-x", "assembler-with-cpp"]
      # 245d248
      # <     "/nsprpub/pr/include/prwin.h",
      - name: Patch NSPR moz.build to preprocess os_Darwin.s
        working-directory: ${{ env.MOZ_DIR }}
        run: |
          # On Darwin, NSPR's moz.build adds
          # nsprpub/pr/src/md/unix/os_Darwin.s to SOURCES. That file is a
          # CPP-driven arch dispatcher:
          #
          #   #ifdef __i386__
          #   #include "os_Darwin_x86.s"
          #   #elif defined(__x86_64__)
          #   #include "os_Darwin_x86_64.s"
          #   ...
          #
          # Mozilla's $(AS) is just $(CC) (clang), and clang only runs the
          # preprocessor on .s inputs when invoked with
          # -x assembler-with-cpp. The pinned revision does not pass that
          # flag, so the assembled object is effectively empty and link
          # fails with undefined __PR_Darwin_x86_64_Atomic{Add,Increment,
          # Decrement,Set} referenced from PR_Atomic* in
          # Unified_c_external_nspr_pr1.o.
          #
          # Upstream mozilla-unified later fixed this by adding
          # `ASFLAGS += ["-x", "assembler-with-cpp"]` inside the Darwin
          # branch of config/external/nspr/pr/moz.build. Backport it here.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("config/external/nspr/pr/moz.build")
          src = p.read_text()
          needle = (
              '    SOURCES += [\n'
              '        "/nsprpub/pr/src/md/unix/darwin.c",\n'
              '        "/nsprpub/pr/src/md/unix/os_Darwin.s",\n'
              '    ]\n'
              '    DEFINES["HAVE_CRT_EXTERNS_H"] = True\n'
          )
          replacement = (
              '    SOURCES += [\n'
              '        "/nsprpub/pr/src/md/unix/darwin.c",\n'
              '        "/nsprpub/pr/src/md/unix/os_Darwin.s",\n'
              '    ]\n'
              '    # os_Darwin.s is a CPP-driven arch dispatcher\n'
              '    # (#ifdef __x86_64__ / __i386__ / __ppc__ ->\n'
              '    # #include "os_Darwin_<arch>.s"); without preprocessing\n'
              '    # the resulting object would be empty.\n'
              '    ASFLAGS += ["-x", "assembler-with-cpp"]\n'
              '    DEFINES["HAVE_CRT_EXTERNS_H"] = True\n'
          )
          if needle not in src:
              raise SystemExit(
                  "config/external/nspr/pr/moz.build layout changed; "
                  "update the os_Darwin.s ASFLAGS patch in "
                  "firefox-macos.yml"
              )
          p.write_text(src.replace(needle, replacement))
          print("Patched config/external/nspr/pr/moz.build")
          PY

      - name: Setup MOZBUILD_STATE_PATH
        run: |
          mkdir -p "$MOZBUILD_STATE_PATH"
          cat > "$MOZBUILD_STATE_PATH/machrc" << 'EOF'
          [mach_telemetry]
          is_enabled = false
          is_set_up = true
          EOF

      - name: Export Berytus to mozilla-unified
        run: |
          ./port export "$MOZ_DIR"

      - name: Create mozconfig
        run: |
          MACOS_SDK_PATH="$(xcrun --show-sdk-path)"
          cat > "$MOZ_DIR/mozconfig" << EOF
          ac_add_options --disable-bootstrap
          ac_add_options --enable-application=browser
          ac_add_options --enable-optimize
          ac_add_options --disable-debug
          ac_add_options --without-wasm-sandboxed-libraries
          ac_add_options --with-ccache=sccache
          ac_add_options --target=x86_64-apple-darwin
          ac_add_options --with-macos-sdk=${MACOS_SDK_PATH}
          EOF

      - name: Test macos sandbox header file compilation
        working-directory: ${{ env.MOZ_DIR }}
        run: |
          ./mach build -v security/sandbox/mac/Sandbox.mm || true
          cat obj-*/config.status

      - name: Install Berytus Toolkit Dependencies
        working-directory: ${{ env.BERYTUS_TOOLKIT_DIR }}
        run: npm install

      - name: Install Secret* Dependencies
        working-directory: ${{ env.SECRETSTAR_DIR }}
        run: npm install

      - name: Build Firefox
        working-directory: ${{ env.MOZ_DIR }}
        run: |
          cd ${{ env.BERYTUS_TOOLKIT_DIR }}
          npm run build
          cd ${{ env.SECRETSTAR_DIR }}
          CI=false npm run build
          ./moz.build.sh
          cd ${{ env.MOZ_DIR }}
          sccache --show-stats
          ./mach build
          sccache --show-stats

      - name: Save build outputs
        uses: actions/cache/save@v4
        env:
          cache-name: cache-build-outputs
        with:
          path: |
            ${{ env.MOZ_OBJ_DIR }}
            ${{ env.MOZ_DIR_CLOBBER }}
            ${{ env.BERYTUS_TOOLKIT_MODULES_DIR }}
            ${{ env.SECRETSTAR_MOZBUILD }}
            ${{ env.SECRETSTAR_BUILD_DIR1 }}
            ${{ env.SECRETSTAR_BUILD_DIR2 }}
            ${{ env.SECRETSTAR_BUILD_DIR3 }}
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ steps.changeset.outputs.rev }}-${{ github.sha }}-${{ github.run_id }}

  check-cache:
    runs-on: macos-14
    needs: build
    timeout-minutes: 10

    steps:
      - name: Check cache usage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          USAGE_JSON=$(gh api repos/${{ github.repository }}/actions/cache/usage)
          USAGE_BYTES=$(echo "$USAGE_JSON" | jq '.active_caches_size_in_bytes')
          USAGE_GB=$(echo "scale=2; $USAGE_BYTES / 2^30" | bc)
          echo "Current cache usage: ${USAGE_GB}GiB"
          THRESHOLD=8.5
          if [ "$(echo "$USAGE_GB >= $THRESHOLD" | bc)" -eq 1 ]; then
            echo "::warning::GitHub Actions cache usage is ${USAGE_GB}GiB (threshold: ${THRESHOLD}GiB / 10GiB limit)"
          fi

  test:
    runs-on: macos-14
    needs: build
    timeout-minutes: 120

    steps:
      - name: Checkout Berytus source
        uses: actions/checkout@v4

      - name: Setup Python 3.8
        uses: actions/setup-python@v6
        with:
          python-version: '3.8'

      - name: Install system dependencies
        run: |
          brew install mercurial openssl bc jq lld

      - name: Clone mozilla-unified
        run: |
          hg clone --stream https://hg.mozilla.org/mozilla-unified "$MOZ_DIR"
          cd "$MOZ_DIR"
          hg update -r ${{ needs.build.outputs.changeset-rev }}

      - name: Export Berytus to mozilla-unified
        run: |
          ./port export "$MOZ_DIR"

      - name: Create mozconfig
        run: |
          cat > "$MOZ_DIR/mozconfig" << 'EOF'
          ac_add_options --disable-bootstrap
          ac_add_options --enable-application=browser
          ac_add_options --enable-optimize
          ac_add_options --disable-debug
          ac_add_options --without-wasm-sandboxed-libraries
          ac_add_options --target=x86_64-apple-darwin
          EOF

      - name: Restore build outputs
        uses: actions/cache/restore@v4
        env:
          cache-name: cache-build-outputs
        with:
          path: |
            ${{ env.MOZ_OBJ_DIR }}
            ${{ env.MOZ_DIR_CLOBBER }}
            ${{ env.BERYTUS_TOOLKIT_MODULES_DIR }}
            ${{ env.SECRETSTAR_MOZBUILD }}
            ${{ env.SECRETSTAR_BUILD_DIR1 }}
            ${{ env.SECRETSTAR_BUILD_DIR2 }}
            ${{ env.SECRETSTAR_BUILD_DIR3 }}
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ needs.build.outputs.changeset-rev }}-${{ github.sha }}-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Restore mozbuild state
        uses: actions/cache/restore@v4
        env:
          cache-name: cache-mozbuild-state
        with:
          path: ${{ env.MOZBUILD_STATE_PATH }}
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ needs.build.outputs.changeset-rev }}-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Regenerate WPT certificates
        working-directory: ${{ env.MOZ_DIR }}/testing/web-platform/tests
        run: |
          echo "Current CA cert validity:"
          openssl x509 -in tools/certs/cacert.pem -noout -dates
          echo "Current Server cert validity:"
          openssl x509 -in tools/certs/web-platform.test.pem -noout -dates
          echo "Extracting Subject Alt Names from existing CA cert..."
          CA_SAN=$(openssl x509 -in tools/certs/cacert.pem -noout -ext subjectAltName \
            | tail -1 | sed 's/^[[:space:]]*//')
          echo "Extracting Name Constraints from existing CA cert..."
          CA_NC=$(openssl x509 -in tools/certs/cacert.pem -noout -ext nameConstraints \
            | tail +3 | sed 's/^[[:space:]]*//' \
            | awk '{printf "permitted;%s\n", $0}')
          echo "Regenerating CA and server certs..."
          openssl req -x509 -newkey rsa:2048 \
            -keyout tools/certs/cacert.key -out tools/certs/cacert.pem \
            -days 365 -nodes -subj "/CN=web-platform-tests" \
            -addext "basicConstraints = critical, CA:TRUE" \
            -addext "keyUsage = keyCertSign" \
            -addext "extendedKeyUsage = serverAuth" \
            -addext "authorityKeyIdentifier = keyid:always, issuer:always" \
            -addext "subjectAltName = $CA_SAN" \
            -addext "nameConstraints = $(echo "$CA_NC" | paste -sd',' -)"
          openssl req -newkey rsa:2048 \
            -keyout tools/certs/web-platform.test.key \
            -out /tmp/wpt.csr \
            -nodes -subj "/CN=web-platform.test" \
            -addext "basicConstraints=CA:FALSE" \
            -addext "keyUsage=digitalSignature,nonRepudiation,keyEncipherment" \
            -addext "extendedKeyUsage=serverAuth" \
            -addext "subjectAltName=$CA_SAN"
          openssl x509 -req -in /tmp/wpt.csr \
            -CA tools/certs/cacert.pem -CAkey tools/certs/cacert.key \
            -CAcreateserial -out tools/certs/web-platform.test.pem -days 365 \
            -copy_extensions copy
          rm -f /tmp/wpt.csr
          echo "New CA cert validity:"
          openssl x509 -in tools/certs/cacert.pem -noout -dates
          echo "New Server cert validity:"
          openssl x509 -in tools/certs/web-platform.test.pem -noout -dates

      - name: Fix typing_extensions for WPT
        run: |
          # The current, bundled typing_extensions at
          # testing/web-platform/tests/tools/third_party/
          # is too old (missing `deprecated`, added in 4.5.0),
          # causing mach wpt to fail. By removing the bundled
          # version (4.1.1), mach wpt will install a newer version
          # via pip. This probably needs to be removed once we
          # use a newer (and stable) mozilla-unified changeset
          rm -rf "$MOZ_DIR/testing/web-platform/tests/tools/third_party/typing_extensions"

      - name: Run Web Platform Tests (Berytus)
        working-directory: ${{ env.MOZ_DIR }}
        env:
          MOZ_LOG: berytus_fetch_observer:7,berytus_http_observer:7,berytus_ke:7,berytus_x509:7,berytus_mask_ipc:7,berytus_agent:7
        run: |
          ./mach wpt --headless testing/web-platform/tests/berytus

      - name: Run xpcshell tests (Berytus)
        working-directory: ${{ env.MOZ_DIR }}
        run: |
          ./mach xpcshell-test --verbose-if-fails --tag berytus

      - name: Run xpcshell tests (Berytus WebExts)
        working-directory: ${{ env.MOZ_DIR }}
        run: |
          ./mach xpcshell-test --verbose-if-fails toolkit/components/extensions/test/xpcshell/test_ext_berytus*

  package:
    runs-on: macos-14
    needs: [build, test]
    timeout-minutes: 30

    steps:
      - name: Checkout Berytus source
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          brew install mercurial

      - name: Setup Python 3.8
        uses: actions/setup-python@v6
        with:
          python-version: '3.8'

      - name: Clone mozilla-unified
        run: |
          hg clone --stream https://hg.mozilla.org/mozilla-unified "$MOZ_DIR"
          cd "$MOZ_DIR"
          hg update -r ${{ needs.build.outputs.changeset-rev }}

      - name: Export Berytus to mozilla-unified
        run: |
          ./port export "$MOZ_DIR"

      - name: Create mozconfig
        run: |
          cat > "$MOZ_DIR/mozconfig" << 'EOF'
          ac_add_options --disable-bootstrap
          ac_add_options --enable-application=browser
          ac_add_options --enable-optimize
          ac_add_options --disable-debug
          ac_add_options --without-wasm-sandboxed-libraries
          ac_add_options --target=x86_64-apple-darwin
          EOF

      - name: Restore build outputs
        uses: actions/cache/restore@v4
        env:
          cache-name: cache-build-outputs
        with:
          path: |
            ${{ env.MOZ_OBJ_DIR }}
            ${{ env.MOZ_DIR_CLOBBER }}
            ${{ env.BERYTUS_TOOLKIT_MODULES_DIR }}
            ${{ env.SECRETSTAR_MOZBUILD }}
            ${{ env.SECRETSTAR_BUILD_DIR1 }}
            ${{ env.SECRETSTAR_BUILD_DIR2 }}
            ${{ env.SECRETSTAR_BUILD_DIR3 }}
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ needs.build.outputs.changeset-rev }}-${{ github.sha }}-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Restore mozbuild state
        uses: actions/cache/restore@v4
        env:
          cache-name: cache-mozbuild-state
        with:
          path: ${{ env.MOZBUILD_STATE_PATH }}
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ needs.build.outputs.changeset-rev }}-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Package Firefox
        working-directory: ${{ env.MOZ_DIR }}
        run: |
          ./mach package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firefox-berytus-macos-x86_64
          path: ${{ env.MOZ_OBJ_DIR }}/dist/*.dmg
          if-no-files-found: error

  cleanup:
    runs-on: macos-14
    needs: [build, test, package]
    if: always()
    timeout-minutes: 20

    steps:
      - name: Delete objdir cache
        env:
          GH_TOKEN: ${{ github.token }}
          cache-name: cache-build-outputs
        run: |
          gh cache delete "${{ runner.os }}-build-${{ env.cache-name }}-${{ needs.build.outputs.changeset-rev }}-${{ github.sha }}-${{ github.run_id }}" \
            --repo "${{ github.repository }}" || true

      - name: Prune old sccache entries
        # The sccache cache key incorporates a content hash of mozilla-unified,
        # so every distinct source state creates a new cache entry. Keep the
        # one with the most recent activity (max of createdAt and
        # lastAccessedAt) and delete the rest. Sorting by lastAccessedAt alone
        # would risk evicting a freshly created entry that hasn't been read
        # yet; sorting by createdAt alone would risk evicting an old entry
        # that's still being actively used.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREFIX="${{ runner.os }}-build-cache-sccache-"
          OLD_KEYS=$(gh cache list \
            --repo "${{ github.repository }}" \
            --key "$PREFIX" \
            --limit 100 \
            --json key,createdAt,lastAccessedAt \
            --jq '
              map(. + {recency: (if .createdAt > .lastAccessedAt then .createdAt else .lastAccessedAt end)})
              | sort_by(.recency) | reverse | .[1:] | .[].key
            ')
          if [ -z "$OLD_KEYS" ]; then
            echo "No stale sccache entries to delete"
            exit 0
          fi
          echo "Deleting stale sccache entries:"
          echo "$OLD_KEYS"
          while IFS= read -r key; do
            [ -z "$key" ] && continue
            gh cache delete "$key" --repo "${{ github.repository }}" || true
          done <<< "$OLD_KEYS"
