name: Firefox with Berytus (Linux)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    outputs:
      changeset-rev: ${{ steps.changeset.outputs.rev }}
      base-image: ${{ steps.tags.outputs.base }}
      build-image: ${{ steps.tags.outputs.build }}
      build-image-exists: ${{ steps.check-build.outputs.exists }}

    steps:
      - name: Checkout Berytus source
        uses: actions/checkout@v4

      - name: Read changeset
        id: changeset
        run: |
          REV=$(grep '^changeset:' mozilla-unified/import-changeset.txt | sed 's/changeset:[[:space:]]*//' | cut -d: -f2)
          echo "rev=$REV" >> "$GITHUB_OUTPUT"
          echo "Using mozilla-unified changeset: $REV"

      - name: Compute image tags
        id: tags
        env:
          REV: ${{ steps.changeset.outputs.rev }}
          SRC_HASH: ${{ hashFiles('mozilla-unified/**/*') }}
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          BASE_REPO="ghcr.io/${REPO_LC}/firefox-base-x86_64-pc-linux-gnu"
          BUILD_REPO="ghcr.io/${REPO_LC}/firefox-berytus-x86_64-pc-linux-gnu"
          echo "base=${BASE_REPO}:${REV}" >> "$GITHUB_OUTPUT"
          echo "build=${BUILD_REPO}:${REV}-${SRC_HASH}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if base image exists
        id: check-base
        run: |
          if docker manifest inspect "${{ steps.tags.outputs.base }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Base image ${{ steps.tags.outputs.base }} already exists; skipping build"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.check-base.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Configure host swap (12 GiB on /mnt)
        if: steps.check-base.outputs.exists == 'false'
        run: |
          set -eu
          swapoff -a || true
          rm -f /mnt/swapfile /swapfile
          fallocate -l 12G /mnt/swapfile
          chmod 600 /mnt/swapfile
          mkswap /mnt/swapfile
          swapon /mnt/swapfile
          free -h
          swapon --show

      - name: Build and push base image
        if: steps.check-base.outputs.exists == 'false'
        uses: docker/build-push-action@v5
        with:
          context: .github/docker
          file: .github/docker/Dockerfile.linux.base
          push: true
          tags: ${{ steps.tags.outputs.base }}
          build-args: |
            MOZ_REV=${{ steps.changeset.outputs.rev }}

      - name: Write Base Image URI
        id: write-base-image-uri
        run: |
          OUT=/tmp/image-uris
          mkdir -p "$OUT"
          BASE_IMAGE_URI_FILE="firefox-base-linux-x86_64-image.txt"
          printf '%s\n' "${{ steps.tags.outputs.base }}" > "$OUT/$BASE_IMAGE_URI_FILE"
          echo "file=$OUT/$BASE_IMAGE_URI_FILE" >> "$GITHUB_OUTPUT"
          echo "artifact-name=firefox-base-linux-x86_64-image" >> "$GITHUB_OUTPUT"

      - name: Upload base image URI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.write-base-image-uri.outputs.artifact-name }}
          path: ${{ steps.write-base-image-uri.outputs.file }}
          if-no-files-found: error

      - name: Check if build image exists
        id: check-build
        run: |
          if docker manifest inspect "${{ steps.tags.outputs.build }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Build image ${{ steps.tags.outputs.build }} already exists; skipping build"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    runs-on: ubuntu-24.04
    needs: prepare
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    outputs:
      changeset-rev: ${{ steps.changeset.outputs.rev }}
      build-image: ${{ needs.prepare.outputs.build-image }}

    steps:
      - name: Checkout Berytus source
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: needs.prepare.outputs.build-image-exists == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: needs.prepare.outputs.build-image-exists == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Stage build context
        if: needs.prepare.outputs.build-image-exists == 'false'
        run: |
          STAGE=/tmp/build-context
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp port "$STAGE/"
          cp -r mozilla-unified "$STAGE/"
          find "$STAGE" -name node_modules -type d -prune -exec rm -rf {} +
          find "$STAGE" -name .DS_Store -delete

      # The gkrust rustc LTO link peaks well above the runner's 16 GiB RAM
      # (full cross-LTO + -Cdebuginfo=2 + codegen-units=1). BuildKit inherits
      # host swap as long as no --memory-swap cap is set, so a host swapfile
      # lets the link spill instead of OOM-killing.
      - name: Configure host swap (12 GiB on /mnt)
        if: needs.prepare.outputs.build-image-exists == 'false'
        run: |
          set -eu
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
          swapon --show

      - name: Build and push image
        if: needs.prepare.outputs.build-image-exists == 'false'
        uses: docker/build-push-action@v5
        with:
          context: /tmp/build-context
          file: .github/docker/Dockerfile.linux.build
          push: true
          tags: ${{ needs.prepare.outputs.build-image }}
          build-args: |
            BASE_IMAGE=${{ needs.prepare.outputs.base-image }}

      - name: Write Build Image URI
        id: write-build-image-uri
        run: |
          OUT=/tmp/image-uris
          mkdir -p "$OUT"
          BUILD_IMAGE_URI_FILE="firefox-berytus-linux-x86_64-image.txt"
          printf '%s\n' "${{ needs.prepare.outputs.build-image }}" > "$OUT/$BUILD_IMAGE_URI_FILE"
          echo "file=$OUT/$BUILD_IMAGE_URI_FILE" >> "$GITHUB_OUTPUT"
          echo "artifact-name=firefox-berytus-linux-x86_64-image" >> "$GITHUB_OUTPUT"

      - name: Upload build image URI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.write-build-image-uri.outputs.artifact-name }}
          path: ${{ steps.write-build-image-uri.outputs.file }}
          if-no-files-found: error

  test:
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 120

    steps:
      - name: Checkout Berytus source
        uses: actions/checkout@v4

      - name: Run Web Platform Tests (Berytus)
        uses: addnab/docker-run-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          image: ${{ needs.build.outputs.build-image }}
          shell: bash
          run: |
            export MOZ_LOG="berytus_fetch_observer:7,berytus_http_observer:7,berytus_ke:7,berytus_x509:7,berytus_mask_ipc:7,berytus_agent:7"
            ./mach wpt --headless testing/web-platform/tests/berytus

      - name: Run xpcshell tests (Berytus)
        uses: addnab/docker-run-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          image: ${{ needs.build.outputs.build-image }}
          shell: bash
          run: |
            export MOZ_LOG="berytus_fetch_observer:7,berytus_http_observer:7,berytus_ke:7,berytus_x509:7,berytus_mask_ipc:7,berytus_agent:7"
            ./mach xpcshell-test --verbose-if-fails --tag berytus

      - name: Run xpcshell tests (Berytus WebExts)
        uses: addnab/docker-run-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          image: ${{ needs.build.outputs.build-image }}
          shell: bash
          run: |
            export MOZ_LOG="berytus_fetch_observer:7,berytus_http_observer:7,berytus_ke:7,berytus_x509:7,berytus_mask_ipc:7,berytus_agent:7"
            ./mach xpcshell-test --verbose-if-fails toolkit/components/extensions/test/xpcshell/test_ext_berytus*

  package:
    runs-on: ubuntu-24.04
    needs: [build, test]
    timeout-minutes: 30

    steps:
      - name: Checkout Berytus source
        uses: actions/checkout@v4

      - name: Package Firefox
        uses: addnab/docker-run-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          image: ${{ needs.build.outputs.build-image }}
          shell: bash
          options: -v ${{ runner.temp }}/out:/dist
          run: |
            ./mach package
            cp obj-*/dist/*.tar.bz2 /dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firefox-berytus-linux-x86_64
          path: ${{ runner.temp }}/out/*.tar.bz2
          if-no-files-found: error