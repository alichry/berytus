name: Firefox with Berytus (Windows)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

defaults:
  run:
    # Use Git Bash for `run:` steps so the same POSIX recipes (heredocs,
    # path translation) work on Windows runners. Steps that need cmd or
    # PowerShell set `shell:` explicitly.
    shell: bash

jobs:
  prepare:
    runs-on: windows-2022
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    outputs:
      changeset-rev: ${{ steps.changeset.outputs.rev }}
      base-image: ${{ steps.tags.outputs.base }}
      build-image: ${{ steps.tags.outputs.build }}
      build-image-exists: ${{ steps.check-build.outputs.exists }}

    steps:
      - name: Checkout Berytus source
        uses: actions/checkout@v4

      - name: Read changeset
        id: changeset
        run: |
          REV=$(grep '^changeset:' mozilla-unified/import-changeset.txt | sed 's/changeset:[[:space:]]*//' | cut -d: -f2)
          echo "rev=$REV" >> "$GITHUB_OUTPUT"
          echo "Using mozilla-unified changeset: $REV"

      - name: Compute image tags
        id: tags
        env:
          REV: ${{ steps.changeset.outputs.rev }}
          SRC_HASH: ${{ hashFiles('mozilla-unified/**/*') }}
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          BASE_REPO="ghcr.io/${REPO_LC}/firefox-base-x86_64-pc-mingw32"
          BUILD_REPO="ghcr.io/${REPO_LC}/firefox-berytus-x86_64-pc-mingw32"
          echo "base=${BASE_REPO}:${REV}" >> "$GITHUB_OUTPUT"
          echo "build=${BUILD_REPO}:${REV}-${SRC_HASH}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if base image exists
        id: check-base
        run: |
          if docker manifest inspect "${{ steps.tags.outputs.base }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Base image ${{ steps.tags.outputs.base }} already exists; skipping build"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push base image
        if: steps.check-base.outputs.exists == 'false'
        shell: cmd
        run: |
          docker build ^
            --file .github\docker\Dockerfile.windows.base ^
            --tag ${{ steps.tags.outputs.base }} ^
            --build-arg MOZ_REV=${{ steps.changeset.outputs.rev }} ^
            .github\docker
          docker push ${{ steps.tags.outputs.base }}

      - name: Write Base Image URI
        id: write-base-image-uri
        run: |
          OUT="$RUNNER_TEMP/image-uris"
          mkdir -p "$OUT"
          BASE_IMAGE_URI_FILE="firefox-base-windows-x86_64-image.txt"
          printf '%s\n' "${{ steps.tags.outputs.base }}" > "$OUT/$BASE_IMAGE_URI_FILE"
          echo "file=$OUT/$BASE_IMAGE_URI_FILE" >> "$GITHUB_OUTPUT"
          echo "artifact-name=firefox-base-windows-x86_64-image" >> "$GITHUB_OUTPUT"

      - name: Upload base image URI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.write-base-image-uri.outputs.artifact-name }}
          path: ${{ steps.write-base-image-uri.outputs.file }}
          if-no-files-found: error

      - name: Check if build image exists
        id: check-build
        run: |
          if docker manifest inspect "${{ steps.tags.outputs.build }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Build image ${{ steps.tags.outputs.build }} already exists; skipping build"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    runs-on: windows-2022
    needs: prepare
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    outputs:
      changeset-rev: ${{ needs.prepare.outputs.changeset-rev }}
      build-image: ${{ needs.prepare.outputs.build-image }}

    steps:
      - name: Checkout Berytus source
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: needs.prepare.outputs.build-image-exists == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage build context
        if: needs.prepare.outputs.build-image-exists == 'false'
        run: |
          STAGE="$RUNNER_TEMP/build-context"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp port "$STAGE/"
          cp -r mozilla-unified "$STAGE/"
          find "$STAGE" -name node_modules -type d -prune -exec rm -rf {} +
          find "$STAGE" -name .DS_Store -delete
          # Pass the staged path back to later steps via env so we don't
          # have to repeat the $RUNNER_TEMP -> Windows path dance.
          echo "BUILD_CONTEXT=$STAGE" >> "$GITHUB_ENV"

      - name: Build and push image
        if: needs.prepare.outputs.build-image-exists == 'false'
        shell: cmd
        run: |
          docker build ^
            --file .github\docker\Dockerfile.windows.build ^
            --tag ${{ needs.prepare.outputs.build-image }} ^
            --build-arg BASE_IMAGE=${{ needs.prepare.outputs.base-image }} ^
            "%BUILD_CONTEXT%"
          docker push ${{ needs.prepare.outputs.build-image }}

      - name: Write Build Image URI
        id: write-build-image-uri
        run: |
          OUT="$RUNNER_TEMP/image-uris"
          mkdir -p "$OUT"
          BUILD_IMAGE_URI_FILE="firefox-berytus-windows-x86_64-image.txt"
          printf '%s\n' "${{ needs.prepare.outputs.build-image }}" > "$OUT/$BUILD_IMAGE_URI_FILE"
          echo "file=$OUT/$BUILD_IMAGE_URI_FILE" >> "$GITHUB_OUTPUT"
          echo "artifact-name=firefox-berytus-windows-x86_64-image" >> "$GITHUB_OUTPUT"

      - name: Upload build image URI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.write-build-image-uri.outputs.artifact-name }}
          path: ${{ steps.write-build-image-uri.outputs.file }}
          if-no-files-found: error

  test:
    runs-on: windows-2022
    needs: build
    timeout-minutes: 120

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull build image
        shell: cmd
        run: docker pull ${{ needs.build.outputs.build-image }}

      - name: Run Web Platform Tests (Berytus)
        shell: cmd
        env:
          MOZ_LOG: berytus_fetch_observer:7,berytus_http_observer:7,berytus_ke:7,berytus_x509:7,berytus_mask_ipc:7,berytus_agent:7
        run: |
          docker run --rm ^
            -e MOZ_LOG ^
            ${{ needs.build.outputs.build-image }} ^
            wpt --headless testing/web-platform/tests/berytus

      - name: Run xpcshell tests (Berytus)
        shell: cmd
        env:
          MOZ_LOG: berytus_fetch_observer:7,berytus_http_observer:7,berytus_ke:7,berytus_x509:7,berytus_mask_ipc:7,berytus_agent:7
        run: |
          docker run --rm ^
            -e MOZ_LOG ^
            ${{ needs.build.outputs.build-image }} ^
            xpcshell-test --verbose-if-fails --tag berytus

      - name: Run xpcshell tests (Berytus WebExts)
        shell: cmd
        env:
          MOZ_LOG: berytus_fetch_observer:7,berytus_http_observer:7,berytus_ke:7,berytus_x509:7,berytus_mask_ipc:7,berytus_agent:7
        run: |
          docker run --rm ^
            -e MOZ_LOG ^
            ${{ needs.build.outputs.build-image }} ^
            xpcshell-test --verbose-if-fails toolkit/components/extensions/test/xpcshell/test_ext_berytus*

  package:
    runs-on: windows-2022
    needs: [build, test]
    timeout-minutes: 30

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull build image
        shell: cmd
        run: docker pull ${{ needs.build.outputs.build-image }}

      - name: Prepare output dir
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          # Forward-slash form is fine for bash; convert for cmd in the
          # next step.
          echo "OUT_DIR_WIN=$(cygpath -w "$RUNNER_TEMP/out")" >> "$GITHUB_ENV"

      - name: Package Firefox
        shell: cmd
        run: |
          docker run --rm ^
            -v "%OUT_DIR_WIN%:C:\dist" ^
            --entrypoint cmd ^
            ${{ needs.build.outputs.build-image }} ^
            /S /C "call \"%VS_BUILDTOOLS%\VC\Auxiliary\Build\vcvars64.bat\" && cd /d \"%MOZ_DIR%\" && mach package && xcopy /Y /S \"%MOZ_OBJ_DIR%\dist\*.win64.zip\" C:\dist\ && (if exist \"%MOZ_OBJ_DIR%\dist\install\sea\" xcopy /Y /S \"%MOZ_OBJ_DIR%\dist\install\sea\*.installer.exe\" C:\dist\ ) "

      - name: Upload artifact (zip)
        uses: actions/upload-artifact@v4
        with:
          name: firefox-berytus-windows-x86_64-zip
          path: ${{ runner.temp }}/out/*.win64.zip
          if-no-files-found: error

      - name: Upload artifact (installer)
        uses: actions/upload-artifact@v4
        with:
          name: firefox-berytus-windows-x86_64-installer
          path: ${{ runner.temp }}/out/*.installer.exe
          if-no-files-found: warn
